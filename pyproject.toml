[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-classifier"
version = "0.1.0"
description = "Memory-constrained five-class vehicle image classifier"
requires-python = ">=3.10"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "Pillow==11.1.0",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.17.1"]
data = ["dvc[s3]==3.67.1"]
tracking = ["mlflow==3.16.1"]
api = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "python-multipart==0.0.20",
  "prometheus-client==0.26.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
]

[tool.setuptools]
packages = ["vehicle_classifier_core"]
py-modules = ["vehicle_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["tempCodeRunnerFile.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
