name: Manual GPU training

on:
  workflow_dispatch:
    inputs:
      cuda_wheel:
        description: CUDA wheel index compatible with the runner's NVIDIA driver
        required: true
        type: choice
        default: cu124
        options:
          - cu118
          - cu124
          - cu126

permissions:
  contents: read

concurrency:
  group: manual-gpu-training
  cancel-in-progress: false

jobs:
  train:
    name: Reproducible teacher and student training
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 720
    defaults:
      run:
        working-directory: training-src
    env:
      # ── DagsHub DVC Remote ────────────────────────────────────────────────
      DAGSHUB_USERNAME: ${{ vars.DAGSHUB_USERNAME }}
      DAGSHUB_REPO_NAME: ${{ vars.DAGSHUB_REPO_NAME }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      # ── DagsHub Hosted MLflow (centralised experiment tracking) ───────────
      MLFLOW_TRACKING_URI: https://dagshub.com/${{ vars.DAGSHUB_USERNAME }}/${{ vars.DAGSHUB_REPO_NAME }}.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ vars.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_EXPERIMENT_NAME: VehicleClassifier
    steps:
      - name: Check out source in an isolated runner directory
        uses: actions/checkout@v7
        with:
          path: training-src

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            training-src/requirements-dvc.txt
            training-src/requirements-mlflow.txt
            training-src/requirements-api.txt
            training-src/pyproject.toml

      - name: Install CUDA PyTorch and pipeline dependencies
        env:
          CUDA_WHEEL: ${{ inputs.cuda_wheel }}
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install \
            torch==2.6.0 torchvision==0.21.0 \
            --index-url "https://download.pytorch.org/whl/$CUDA_WHEEL" \
            --extra-index-url https://pypi.org/simple
          python -m pip install Pillow==11.1.0 PyYAML==6.0.2
          python -m pip install -r requirements-dvc.txt -r requirements-mlflow.txt -r requirements-api.txt
          python -m pip install --no-deps -e .

      - name: Verify GPU and CUDA runtime
        run: |
          nvidia-smi
          python -c "import torch; assert torch.cuda.is_available(), 'CUDA unavailable to PyTorch'; print(torch.cuda.get_device_name(0), torch.version.cuda)"

      - name: Configure DVC remote credentials (DagsHub)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DAGSHUB_USERNAME:-}" || -z "${DAGSHUB_REPO_NAME:-}" || -z "${DAGSHUB_TOKEN:-}" ]]; then
            echo "Set Actions variables DAGSHUB_USERNAME, DAGSHUB_REPO_NAME and secret DAGSHUB_TOKEN." >&2
            exit 1
          fi
          DAGSHUB_ENDPOINT="https://dagshub.com/${DAGSHUB_USERNAME}/${DAGSHUB_REPO_NAME}.s3"
          dvc remote modify --local storage endpointurl "${DAGSHUB_ENDPOINT}"
          dvc remote modify --local storage access_key_id "${DAGSHUB_TOKEN}"
          dvc remote modify --local storage secret_access_key "${DAGSHUB_TOKEN}"

      - name: Pull versioned datasets
        run: dvc pull vehicle_dataset.dvc test_dataset.dvc test_MIO_TCD_data.dvc

      - name: Run DVC training and evaluation pipeline
        run: dvc repro train_teacher train_student evaluate_target evaluate_ood

      - name: Push DVC outputs and stage cache
        run: dvc push

      - name: Preserve run lineage and results in workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: training-run-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            training-src/dvc.lock
            training-src/student_model.pth
            training-src/student_model.pth.json
            training-src/reports/data_validation.json
            training-src/reports/teacher_run.json
            training-src/reports/distillation_run.json
            training-src/reports/evaluation.json
            training-src/reports/ood_evaluation.json
          # Note: MLflow runs & artifacts now live on DagsHub — no local mlflow.db to upload.
