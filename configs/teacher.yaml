seed: 1729
deterministic: true
device: auto
data:
  train_dir: ./vehicle_dataset
  validation_fraction: 0.2
  num_workers: 0
  manifest: data/manifests/data_manifest.json
preprocessing:
  size: [224, 224]
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
augmentation:
  horizontal_flip_probability: 0.5
  rotation_degrees: 15
  translation_fraction: [0.1, 0.1]
  scale_range: [0.9, 1.1]
  brightness_jitter: 0.3
  contrast_jitter: 0.3
  random_erasing_probability: 0.5
  random_erasing_scale: [0.02, 0.2]
  random_erasing_ratio: [0.3, 3.3]
training:
  batch_size: 16
  epochs: 8
  learning_rate: 0.0001
  gradient_accumulation_steps: 2
  checkpoint: EfficientNet_B2_teacher_model.pth
  use_imagenet_pretrained: true
output:
  run_metadata: reports/teacher_run.json
