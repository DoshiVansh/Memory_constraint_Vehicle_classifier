services:
  rustfs:
    image: rustfs/rustfs:1.0.3-glibc
    profiles: [dvc-storage]
    command: /data
    env_file: .env
    environment:
      RUSTFS_ACCESS_KEY: ${DVC_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${DVC_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "${DVC_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${DVC_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

volumes:
  rustfs_data:
