        {
          "id": 14,
          "type": "gauge",
          "title": "Active In-Flight Requests",
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 12,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
