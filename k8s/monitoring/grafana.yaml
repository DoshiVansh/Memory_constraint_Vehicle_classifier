        {
          "id": 16,
          "type": "text",
          "title": "\ud83d\udd2c OpenTelemetry Distributed Tracing & Execution Waterfall",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "options": {
            "mode": "markdown",
            "content": "# \ud83d\udd2c Live Distributed Tracing & Span Waterfall Dashboard\n\nTo select individual request threads and inspect the exact API calls, child functions, microsecond latencies, and span attributes:\n\n### \ud83d\ude80 [Open Interactive Tracing Waterfall UI (http://20.200.237.154:8000/traces)](http://20.200.237.154:8000/traces)\n**JSON Traces Endpoint**: [`/api/traces`](http://20.200.237.154:8000/api/traces) | **Interactive Swagger Docs**: [`/docs`](http://20.200.237.154:8000/docs)\n\n---\n\n### \ud83d\udcca Execution Waterfall & Function Call Hierarchy\n```\npredict_request (HTTP POST /predict - Root Span)\n  \u251c\u2500\u2500 [01] read_upload_payload          : validates multipart byte streams, buffers memory\n  \u251c\u2500\u2500 [02] validate_and_decode_image    : image format safety checks, PIL decompression\n  \u251c\u2500\u2500 [03] convert_image_rgb            : transforms RGBA/Grayscale to RGB tensor\n  \u2514\u2500\u2500 [04] model_inference              : normalizes tensor & executes neural model\n        \u2514\u2500\u2500 [05] pytorch_forward_pass   : ShuffleNet V2 forward graph computation\n```\n\n#### \u2728 Features of the Traces Dashboard:\n- **Thread / Request Selector**: Click any request on the left sidebar to load its complete trace.\n- **Gantt Waterfall Timeline**: Visually inspect relative timing and parallel overhead of every sub-function.\n- **Span Inspector Card**: Click any span to see microsecond duration, parent/child IDs, `image.format`, `image.size_bytes`, `prediction.class`, `prediction.confidence`, and `thread.id`.\n- **Real-time Live Stream**: Auto-polls every 3 seconds to capture fresh traffic from the in-cluster traffic generator."
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-classifier-grafana
  namespace: vehicle-classifier-staging
  labels:
    app.kubernetes.io/name: vehicle-classifier-grafana
    app.kubernetes.io/part-of: vehicle-classifier
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-classifier-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-classifier-grafana
        app.kubernetes.io/part-of: vehicle-classifier
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_AUTH_BASIC_ENABLED
              value: "true"
            - name: GF_LOG_LEVEL
              value: "warn"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /etc/grafana/dashboards/vehicle-classifier.json
              subPath: vehicle-classifier.json
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: vehicle-classifier-grafana-provisioning
        - name: dashboards
          configMap:
            name: vehicle-classifier-grafana-dashboard
        - name: data
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: vehicle-classifier-staging
  labels:
    app.kubernetes.io/name: vehicle-classifier-grafana
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: vehicle-classifier-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
