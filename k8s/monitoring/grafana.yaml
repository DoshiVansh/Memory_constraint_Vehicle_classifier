apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-classifier-grafana-provisioning
  namespace: vehicle-classifier-staging
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: vehicle-classifier-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.vehicle-classifier-staging.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: vehicle-classifier
        orgId: 1
        folder: Vehicle Classifier
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-classifier-grafana-dashboard
  namespace: vehicle-classifier-staging
data:
  vehicle-classifier.json: |
    {
      "id": null,
      "uid": "vehicle-classifier-overview",
      "title": "Vehicle Classifier Enterprise MLOps Observability",
      "description": "Real-time production monitoring: inference traffic, latency percentiles, error rates, model class distribution, pod resources, and OpenTelemetry distributed tracing.",
      "schemaVersion": 41,
      "version": 2,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Total Inferences Served",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(vehicle_classifier_requests_total{endpoint=\"/predict\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Prediction Throughput",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vehicle_classifier_requests_total{endpoint=\"/predict\"}[1m]))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 Latency SLA",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(vehicle_classifier_request_duration_seconds_bucket{endpoint=\"/predict\"}[2m])))",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 25
                  },
                  {
                    "color": "red",
                    "value": 35
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "HTTP Success Rate",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(1 - (sum(rate(vehicle_classifier_errors_total{endpoint=\"/predict\"}[5m])) or vector(0)) / clamp_min(sum(rate(vehicle_classifier_requests_total{endpoint=\"/predict\"}[5m])), 0.001)) * 100",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 90
                  },
                  {
                    "color": "green",
                    "value": 95
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Active API Replicas",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(up{job=\"vehicle-classifier-api\"} == 1)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "yellow",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Champion Model",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(vehicle_classifier_model_info)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              }
            }
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Prediction Request Rate (Throughput)",
          "gridPos": {
            "h": 8,
            "w": 10,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(vehicle_classifier_requests_total{endpoint=\"/predict\"}[1m]))",
              "legendFormat": "Total req/sec"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 30,
                "gradientMode": "opacity",
                "lineWidth": 2
              }
            }
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 8,
          "type": "piechart",
          "title": "Vehicle Class Predictions Distribution",
          "gridPos": {
            "h": 8,
            "w": 7,
            "x": 10,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (predicted_class) (increase(vehicle_classifier_predictions_total[15m]))",
              "legendFormat": "{{predicted_class}}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "options": {
            "pieType": "donut",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            },
            "legend": {
              "displayMode": "table",
              "values": [
                "percent",
                "value"
              ]
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Predictions by Class Over Time",
          "gridPos": {
            "h": 8,
            "w": 7,
            "x": 17,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (predicted_class) (rate(vehicle_classifier_predictions_total[1m]))",
              "legendFormat": "{{predicted_class}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "fillOpacity": 40
              }
            }
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "list"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "End-to-End Request Turnaround Latency (p50 / p90 / p95 / p99)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1000 * histogram_quantile(0.50, sum by (le) (rate(vehicle_classifier_request_duration_seconds_bucket{endpoint=\"/predict\"}[2m])))",
              "legendFormat": "p50 Median"
            },
            {
              "refId": "B",
              "expr": "1000 * histogram_quantile(0.90, sum by (le) (rate(vehicle_classifier_request_duration_seconds_bucket{endpoint=\"/predict\"}[2m])))",
              "legendFormat": "p90"
            },
            {
              "refId": "C",
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(vehicle_classifier_request_duration_seconds_bucket{endpoint=\"/predict\"}[2m])))",
              "legendFormat": "p95 SLA (Target <25ms)"
            },
            {
              "refId": "D",
              "expr": "1000 * histogram_quantile(0.99, sum by (le) (rate(vehicle_classifier_request_duration_seconds_bucket{endpoint=\"/predict\"}[2m])))",
              "legendFormat": "p99 Tail"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "spanNulls": true
              }
            }
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Pure Model Inference vs API Network Overhead",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(vehicle_classifier_inference_duration_seconds_bucket[2m])))",
              "legendFormat": "p95 Pure PyTorch Forward Pass"
            },
            {
              "refId": "B",
              "expr": "1000 * histogram_quantile(0.95, sum by (le) (rate(vehicle_classifier_request_duration_seconds_bucket{endpoint=\"/predict\"}[2m])))",
              "legendFormat": "p95 Total Turnaround (Decode + Preprocess + Net)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            }
          },
          "options": {
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "API Container CPU Usage",
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(process_cpu_seconds_total{job=\"vehicle-classifier-api\"}[1m]))",
              "legendFormat": "Total CPU Cores"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "fillOpacity": 20
              }
            }
          },
          "options": {
            "legend": {
              "showLegend": true
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "API Resident Memory (RAM RSS)",
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 6,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "vehicle-classifier-prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(process_resident_memory_bytes{job=\"vehicle-classifier-api\"})",
