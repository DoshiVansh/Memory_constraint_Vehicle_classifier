apiVersion: v1
kind: ConfigMap
metadata:
  name: vehicle-classifier-prometheus-config
  namespace: vehicle-classifier-staging
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/vehicle-classifier.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["vehicle-classifier-alertmanager.vehicle-classifier-staging.svc.cluster.local:9093"]
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: vehicle-classifier-api
        metrics_path: /metrics
        static_configs:
          - targets: ["vehicle-classifier-api.vehicle-classifier-staging.svc.cluster.local:8000"]
  vehicle-classifier.yml: |
    groups:
      - name: vehicle-classifier-api
        rules:
          - alert: VehicleClassifierTargetDown
            expr: up{job="vehicle-classifier-api"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Vehicle classifier metrics target is unreachable
              description: Prometheus has failed to scrape the API for at least one minute.
          - alert: VehicleClassifierHighServerErrorRate
            expr: |
              (
                sum(rate(vehicle_classifier_errors_total{endpoint="/predict",error_type="http_5xx"}[5m]))
                or vector(0)
              ) / clamp_min(sum(rate(vehicle_classifier_requests_total{endpoint="/predict"}[5m])), 0.000001) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Vehicle classifier prediction errors exceed 5 percent
              description: The prediction endpoint has exceeded a temporary 5 percent server-error warning threshold for five minutes.
          - alert: VehicleClassifierHighInferenceLatency
            expr: |
              histogram_quantile(0.95, sum(rate(vehicle_classifier_inference_duration_seconds_bucket[5m])) by (le)) > 0.015
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Vehicle classifier p95 inference latency exceeds 15ms SLA
              description: The 95th percentile CPU inference latency has exceeded the 15 ms target SLA for at least 5 minutes.
          - alert: VehicleClassifierLowConfidenceSpike
            expr: |
              (
                sum(rate(vehicle_classifier_low_confidence_predictions_total[5m]))
                or vector(0)
              ) / clamp_min(sum(rate(vehicle_classifier_predictions_total[5m])), 0.000001) > 0.20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Vehicle classifier low-confidence predictions exceed 20 percent
              description: More than 20 percent of model predictions over the last 5 minutes had confidence below 0.70, indicating potential data distribution drift.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-classifier-prometheus
  namespace: vehicle-classifier-staging
  labels:
    app.kubernetes.io/name: vehicle-classifier-prometheus
    app.kubernetes.io/part-of: vehicle-classifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-classifier-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-classifier-prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/rules/vehicle-classifier.yml
              subPath: vehicle-classifier.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vehicle-classifier-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: vehicle-classifier-prometheus-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vehicle-classifier-prometheus-pvc
  namespace: vehicle-classifier-staging
  labels:
    app.kubernetes.io/name: vehicle-classifier-prometheus
    app.kubernetes.io/part-of: vehicle-classifier
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: vehicle-classifier-staging
  labels:
    app.kubernetes.io/name: vehicle-classifier-prometheus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vehicle-classifier-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
